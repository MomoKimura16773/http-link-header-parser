[project]
name = "http-link-header-parser"
version = "0.1.0"
description = "Parses RFC 8288 Link headers into structured relations, including parameters like rel, type, title, and anchor."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
